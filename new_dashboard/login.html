<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入｜網段設備看板</title>
<link rel="stylesheet" href="static/css/css2.css">
<link rel="stylesheet" href="static/css/all.min.css">
<script src="static/js/vue.global.js"></script>

<style>
:root{
    --bg:#0f1620;--panel:#151d28;--panel-2:#1b2532;--line:#263242;
    --text:#e6edf3;--text-2:#9aa8b8;--text-3:#66748a;
    --blue:#4c8dff;--blue-soft:rgba(76,141,255,.14);--red:#f0616b;--red-soft:rgba(240,97,107,.14);
    --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
    --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
    background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 背景：淡淡的網格，呼應「網段」 */
body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:40px 40px;opacity:.28;
    mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
}

.shell{
    display:flex;width:860px;max-width:calc(100vw - 32px);min-height:520px;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.5);
    animation:cardIn .35s cubic-bezier(.22,1,.36,1) both;
}
@media (max-width:820px){.shell{width:380px;min-height:0}.side{display:none}}

/* 左側：網路拓樸插圖 */
.side{
    flex:1;position:relative;padding:32px;
    background:radial-gradient(120% 80% at 20% 0%,rgba(76,141,255,.18),transparent 60%),var(--bg);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
}
.side h1{font-size:22px;font-weight:600;line-height:1.3;margin-bottom:6px}
.side p{font-size:13px;color:var(--text-2);max-width:30ch}
.topo{flex:1;width:100%;margin-top:8px}
.topo .link{stroke:var(--line);stroke-width:1.5}
.topo .node{fill:var(--panel-2);stroke:var(--line);stroke-width:1.5}
.topo .node.core{fill:var(--blue-soft);stroke:var(--blue)}
.topo .lbl{font-family:var(--mono);font-size:11px;fill:var(--text-2)}
.topo .lbl.core{fill:var(--blue);font-weight:600}
.topo .pkt{fill:var(--blue);r:3}
.topo .pkt.g{fill:#3fb950}
.topo .ring{fill:none;stroke:var(--blue);stroke-width:1.5;opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{r:10;opacity:.6}100%{r:34;opacity:0}}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-3);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.card{flex:0 0 380px;padding:36px 36px 30px;display:flex;flex-direction:column;justify-content:center}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.brand-ic{
    width:42px;height:42px;border-radius:10px;background:var(--blue-soft);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:18px;
}
.brand-title{font-size:18px;font-weight:600;line-height:1.2}
.brand-sub{font-size:12px;color:var(--text-3);margin-top:3px}

.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px}
.field .box{
    display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;
    background:var(--bg);border:1px solid var(--line);border-radius:8px;transition:border-color .15s;
}
.field .box:focus-within{border-color:var(--blue)}
.field .box.err{border-color:var(--red)}
.field .box i{color:var(--text-3);font-size:13px;width:14px;text-align:center}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px}
.field input::placeholder{color:var(--text-3)}
.field input.mono{font-family:var(--mono);letter-spacing:.3px}
.eye{color:var(--text-3);font-size:13px;padding:4px}
.eye:hover{color:var(--text)}

.error{
    display:flex;align-items:center;gap:8px;
    background:var(--red-soft);color:var(--red);border-radius:8px;
    padding:9px 12px;font-size:13px;margin:-4px 0 16px;
    animation:shake .35s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}

.actions{display:flex;gap:10px;margin-top:8px}
.btn{
    height:42px;border-radius:8px;font-size:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid var(--line);color:var(--text-2);padding:0 18px;transition:all .15s;
}
.btn:hover{color:var(--text);background:var(--panel-2)}
.btn.primary{flex:1;background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:hover{background:#3f7ff2}
.btn.primary:disabled{opacity:.6;cursor:progress}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--text-3)}
.foot .mono{font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <div class="shell">

    <div class="side">
        <h1>每一個 IP，<br>都看得見。</h1>
        <p>K11、K18、K21、K22、K25 各樓層網段的 EAP、EQP、Switch 狀態與異動紀錄。</p>

        <svg class="topo" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- 連線 -->
            <g>
                <path id="l1" class="link" d="M210 150 L70 60"/>
                <path id="l2" class="link" d="M210 150 L350 60"/>
                <path id="l3" class="link" d="M210 150 L60 190"/>
                <path id="l4" class="link" d="M210 150 L360 200"/>
                <path id="l5" class="link" d="M210 150 L210 265"/>
                <path class="link" d="M70 60 L60 190" stroke-dasharray="3 5"/>
                <path class="link" d="M350 60 L360 200" stroke-dasharray="3 5"/>
            </g>

            <!-- 封包沿線移動 -->
            <circle class="pkt"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
            <circle class="pkt g"><animateMotion dur="3.1s" begin="-1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l2"/></animateMotion></circle>
            <circle class="pkt"><animateMotion dur="2.9s" begin="-.6s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
            <circle class="pkt g"><animateMotion dur="3.4s" begin="-2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l4"/></animateMotion></circle>
            <circle class="pkt"><animateMotion dur="2.2s" begin="-1.4s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>

            <!-- 核心 -->
            <circle class="ring" cx="210" cy="150" r="10"/>
            <circle class="ring" cx="210" cy="150" r="10" style="animation-delay:1.2s"/>
            <circle class="node core" cx="210" cy="150" r="14"/>
            <text class="lbl core" x="210" y="181" text-anchor="middle">Core</text>

            <!-- 棟別 -->
            <circle class="node" cx="70"  cy="60"  r="11"/><text class="lbl" x="70"  y="40"  text-anchor="middle">K11</text>
            <circle class="node" cx="350" cy="60"  r="11"/><text class="lbl" x="350" y="40"  text-anchor="middle">K18</text>
            <circle class="node" cx="60"  cy="190" r="11"/><text class="lbl" x="60"  y="216" text-anchor="middle">K21</text>
            <circle class="node" cx="360" cy="200" r="11"/><text class="lbl" x="360" y="226" text-anchor="middle">K22</text>
            <circle class="node" cx="210" cy="265" r="11"/><text class="lbl" x="210" y="291" text-anchor="middle">K25</text>
        </svg>

        <div class="legend">
            <span><i style="background:var(--blue)"></i>EAP</span>
            <span><i style="background:#3fb950"></i>連線中</span>
            <span><i style="background:var(--red)"></i>離線</span>
        </div>
    </div>

    <div class="card">

        <div class="brand">
            <div class="brand-ic"><i class="fa-solid fa-network-wired"></i></div>
            <div>
                <div class="brand-title">網段設備看板</div>
                <div class="brand-sub">請用公司帳號登入</div>
            </div>
        </div>

        <div class="field">
            <label for="u">帳號</label>
            <div class="box" :class="{ err: errorMsg }">
                <i class="fa-solid fa-user"></i>
                <input id="u" v-model="username" class="mono" type="text" placeholder="例如 K18251"
                       autocomplete="username" autocapitalize="characters" spellcheck="false"
                       @keyup.enter="login" autofocus>
            </div>
        </div>

        <div class="field">
            <label for="p">密碼</label>
            <div class="box" :class="{ err: errorMsg }">
                <i class="fa-solid fa-lock"></i>
                <input id="p" v-model="password" :type="showPw ? 'text' : 'password'" placeholder="輸入密碼"
                       autocomplete="current-password" @keyup.enter="login">
                <button type="button" class="eye" @click="showPw = !showPw" :title="showPw ? '隱藏密碼' : '顯示密碼'">
                    <i :class="showPw ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                </button>
            </div>
        </div>

        <div v-if="errorMsg" class="error" :key="errorMsg">
            <i class="fa-solid fa-circle-exclamation"></i>{{ errorMsg }}
        </div>

        <div class="actions">
            <button type="button" class="btn" @click="clearInput">清空</button>
            <button type="button" class="btn primary" @click="login" :disabled="loading">
                <span v-if="loading" class="spin"></span>
                <span>{{ loading ? '登入中' : '登入' }}</span>
            </button>
        </div>

        <div class="foot">資訊管理組 <span class="mono">·</span> 網段 IP 管理</div>
    </div>

  </div>
</div>

<script src="login.js"></script>
</body>
</html>
